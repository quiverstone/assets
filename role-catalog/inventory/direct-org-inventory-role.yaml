AWSTemplateFormatVersion: 2010-09-09
Description: >
  Quiverstone Organization Inventory Role - Deploys inventory role in Organization account
  that can be assumed by a dedicated Quiverstone IAM user with required External ID.

Metadata:
  TemplateInfo:
    Name: quiverstone-direct-org-inventory-role
    Deploy-To: Management/Delegated Account Home Region (e.g. us-east-1)
    Version: 3.0.0
    Source: github.com/quiverstone/assets/role-catalog/inventory/direct-org-inventory-role.yaml
    Note: >
      Deploys inventory role in Organization that can be assumed directly by a dedicated
      Quiverstone IAM user with a required External ID for confused deputy protection.
      Supports deployment in either the management account or a delegated admin account.
    QuickStackLink: https://console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/quickcreate?templateURL=https://s3.us-east-2.amazonaws.com/assets.quiverstone.io/role-catalog/inventory/direct-org-inventory-role.yaml&stackName=quiverstone-direct-org-inventory-role
    LastUpdated: 20260422
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Role Configuration
        Parameters:
          - pRoleName
          - pAccountType
          - pExternalId
      - Label:
          default: Quiverstone Trust Configuration
        Parameters:
          - pQuiverstoneProductionAccountId
    ParameterLabels:
      pRoleName:
        default: Target Role Name
      pAccountType:
        default: Account Type
      pExternalId:
        default: External ID (Required)
      pQuiverstoneProductionAccountId:
        default: Quiverstone Production Account (DO NOT MODIFY)

Parameters:
  pRoleName:
    Type: String
    Default: QuiverstoneInventory
    Description: Name for the direct organization inventory role.
    MinLength: 1
    ConstraintDescription: Target Role Name must not be null.

  pQuiverstoneProductionAccountId:
    Type: String
    Default: "684035162433"
    Description: >
      Quiverstone production account ID where the dedicated IAM user resides. DO NOT MODIFY.
    AllowedPattern: "[0-9]{12}"
    MinLength: 1
    ConstraintDescription: Must be a valid 12-digit AWS account ID.

  pAccountType:
    Type: String
    Default: MANAGEMENT
    AllowedValues:
      - MANAGEMENT
      - DELEGATED_ADMIN
    Description: >
      Where is this inventory role being deployed? MANAGEMENT grants full API access including
      service access, delegated admin enumeration, and Control Tower. DELEGATED_ADMIN omits
      management-only APIs that would return AccessDenied.

  pExternalId:
    Type: String
    Description: >
      Unique External ID provided by Quiverstone during organization onboarding. Required
      to prevent confused deputy attacks. Retrieve from your Quiverstone organization settings.
    MinLength: 1
    MaxLength: 1224
    ConstraintDescription: External ID is required. Retrieve this value from your Quiverstone organization settings.

Conditions:
  cIsManagementAccount: !Equals [!Ref pAccountType, MANAGEMENT]

Resources:
  rQuiverstoneDirectOrgInventoryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref pRoleName
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              # AWS: !Sub "arn:aws:iam::${pQuiverstoneProductionAccountId}:user/${pQuiverstoneIAMUserName}"
              AWS: !Sub "arn:aws:iam::${pQuiverstoneProductionAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref pExternalId
      Policies:
        - PolicyName: QuiverstoneInventoryBasePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Organizations read — works from both management and delegated admin
              - Sid: OrganizationsBaseRead
                Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:DescribeOrganizationalUnit
                  - organizations:DescribeAccount
                  - organizations:DescribePolicy
                  - organizations:DescribeResourcePolicy
                  - organizations:DescribeHandshake
                  - organizations:DescribeCreateAccountStatus
                  - organizations:DescribeEffectivePolicy
                  - organizations:ListRoots
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListAccountsForParent
                  - organizations:ListAccounts
                  - organizations:ListChildren
                  - organizations:ListParents
                  - organizations:ListPolicies
                  - organizations:ListPoliciesForTarget
                  - organizations:ListTargetsForPolicy
                  - organizations:ListHandshakesForOrganization
                  - organizations:ListHandshakesForAccount
                  - organizations:ListCreateAccountStatus
                  - organizations:ListTagsForResource
                Resource: "*"
              # Account contacts — returns info for the calling account only
              - Sid: AccountContactsRead
                Effect: Allow
                Action:
                  - account:GetAccountInformation
                  - account:GetAlternateContact
                  - account:GetContactInformation
                  - account:ListRegions
                Resource: "*"
              # IAM Identity Center — returns empty (not error) if instance not in this account
              - Sid: IdentityCenterRead
                Effect: Allow
                Action:
                  - sso:ListInstances
                  - sso:DescribeInstance
                  - sso-admin:ListInstances
                  - sso-admin:DescribeInstance
                  - identitystore:DescribeIdentityStore
                Resource: "*"
        # Management-only APIs — omitted for delegated admin deployments
        - !If
          - cIsManagementAccount
          - PolicyName: QuiverstoneInventoryManagementPolicy
            PolicyDocument:
              Version: 2012-10-17
              Statement:
                - Sid: OrganizationsManagementOnly
                  Effect: Allow
                  Action:
                    - organizations:ListAWSServiceAccessForOrganization
                    - organizations:ListDelegatedAdministrators
                    - organizations:ListDelegatedServicesForAccount
                  Resource: "*"
                - Sid: ControlTowerRead
                  Effect: Allow
                  Action:
                    - controltower:ListLandingZones
                    - controltower:GetLandingZone
                    - controltower:ListEnabledBaselines
                  Resource: "*"
          - !Ref AWS::NoValue

Outputs:
  oTargetRoleArn:
    Description: >
      ARN of the inventory role. Use for 'Target Role ARN' in your Quiverstone
      organization configuration.
    Value: !GetAtt rQuiverstoneDirectOrgInventoryRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleArn"

  oExternalId:
    Description: >
      External ID configured for this role. Must match the External ID in your
      Quiverstone organization settings.
    Value: !Ref pExternalId
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleExternalId"

  oTrustedPrincipal:
    Description: >
      The IAM user principal trusted by this role. Only this specific IAM user
      in the Quiverstone production account can assume this role.
    # Value: !Sub "arn:aws:iam::${pQuiverstoneProductionAccountId}:user/${pQuiverstoneIAMUserName}"
    Value: !Sub "arn:aws:iam::${pQuiverstoneProductionAccountId}:root"
    Export:
      Name: !Sub "${AWS::StackName}-TrustedPrincipal"
