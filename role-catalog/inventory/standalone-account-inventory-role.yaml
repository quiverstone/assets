AWSTemplateFormatVersion: 2010-09-09
Description: >
  Quiverstone Standalone Account Inventory Role - Provides read-only access to a standalone account
  for inventory purposes via a dedicated Quiverstone IAM user with required External ID.

Metadata:
  TemplateInfo:
    Name: quiverstone-standalone-inventory-role
    Deploy-To: Standalone Account Home Region (e.g. us-east-1)
    Version: 2.0.0
    Source: github.com/quiverstone/assets/role-catalog/inventory/standalone-account-inventory-role.yaml
    Note: >
      Deploys a role that can be assumed by a dedicated Quiverstone IAM user for standalone
      account inventory access. Requires an External ID for confused deputy protection.
      Use this for accounts that are NOT part of an AWS Organization.
    QuickStackLink: https://console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/quickcreate?templateURL=https://s3.us-east-2.amazonaws.com/assets.quiverstone.io/role-catalog/inventory/standalone-account-inventory-role.yaml&stackName=quiverstone-standalone-account-inventory-role
    LastUpdated: 20260412
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Role Configuration
        Parameters:
          - pRoleName
          - pExternalId
      - Label:
          default: Quiverstone Trust Configuration
        Parameters:
          - pQuiverstoneProductionAccountId
    ParameterLabels:
      pRoleName:
        default: Target Role Name
      pExternalId:
        default: External ID (Required)
      pQuiverstoneProductionAccountId:
        default: Quiverstone Production Account (DO NOT MODIFY)

Parameters:
  pRoleName:
    Type: String
    Default: QuiverstoneStandaloneAccountInventory
    Description: Name for the standalone account inventory role.
    MinLength: 1
    ConstraintDescription: Target Role Name must not be null.

  pQuiverstoneProductionAccountId:
    Type: String
    Default: "684035162433"
    Description: >
      Quiverstone production account ID where the dedicated IAM user resides. DO NOT MODIFY.
    AllowedPattern: "[0-9]{12}"
    MinLength: 1
    ConstraintDescription: Must be a valid 12-digit AWS account ID.

  pExternalId:
    Type: String
    Description: >
      Unique External ID provided by Quiverstone during organization onboarding. Required
      to prevent confused deputy attacks. Retrieve from your Quiverstone organization settings.
    MinLength: 1
    MaxLength: 1224
    ConstraintDescription: External ID is required. Retrieve this value from your Quiverstone organization settings.

Resources:
  rQuiverstoneStandaloneAccountInventoryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref pRoleName
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${pQuiverstoneProductionAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref pExternalId
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"

Outputs:
  oTargetRoleArn:
    Description: >
      ARN of the inventory role. Use for 'Target Role ARN' in your Quiverstone
      organization configuration.
    Value: !GetAtt rQuiverstoneStandaloneAccountInventoryRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleArn"

  oExternalId:
    Description: >
      External ID configured for this role. Must match the External ID in your
      Quiverstone organization settings.
    Value: !Ref pExternalId
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleExternalId"

  oTrustedPrincipal:
    Description: >
      The IAM user principal trusted by this role. Only this specific IAM user
      in the Quiverstone production account can assume this role.
    Value: !Sub "arn:aws:iam::${pQuiverstoneProductionAccountId}:root"
    Export:
      Name: !Sub "${AWS::StackName}-TrustedPrincipal"
