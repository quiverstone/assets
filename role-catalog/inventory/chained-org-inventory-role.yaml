AWSTemplateFormatVersion: 2010-09-09
Description: >
  Quiverstone Chained Organization Inventory Role - Deploys inventory role in Organization account
  that can be assumed via role chaining from the intermediate account with required External ID.

Metadata:
  TemplateInfo:
    Name: quiverstone-chained-org-inventory-role
    Deploy-To: Management/Delegated Org Account in Home Region (e.g. us-east-1)
    Version: 2.0.0
    Source: github.com/quiverstone/assets/role-catalog/inventory/chained-org-inventory-role.yaml
    Note: >
      Deploys inventory role in Organization that can be assumed via role chaining from the
      intermediate account. An External ID is highly encouraged for confused deputy protection.
    QuickStackLink: https://console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/quickcreate?templateURL=https://s3.us-east-2.amazonaws.com/assets.quiverstone.io/role-catalog/inventory/chained-org-inventory-role.yaml&stackName=quiverstone-chained-org-inventory-role
    LastUpdated: 20260412
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Inventory Role Configuration
        Parameters:
          - pInventoryRoleName
          - pExternalId
      - Label:
          default: Intermediate Account Configuration
        Parameters:
          - pIntermediateAccountId
          - pTrustPrincipals
          - pIntermediateRoleName
    ParameterLabels:
      pInventoryRoleName:
        default: Inventory Role Name
      pExternalId:
        default: External ID (Highly Recommended)
      pIntermediateAccountId:
        default: Your Intermediate Account ID
      pTrustPrincipals:
        default: Trust Scope for Intermediate Account
      pIntermediateRoleName:
        default: Intermediate Role Name (Required if Trust Scope = 'Named')

Parameters:
  pInventoryRoleName:
    Type: String
    Default: QuiverstoneChainedOrgInventory
    Description: Name for the destination organization inventory role.
    MinLength: 1
    ConstraintDescription: Inventory Role Name must not be null.

  pExternalId:
    Type: String
    Description: >
      Unique External ID for this role's trust relationship. HIGHTLY RECOMMENDED to prevent confused
      deputy attacks during role chaining. Retrieve from your Quiverstone organization settings.
    MinLength: 0
    MaxLength: 1224

  pIntermediateAccountId:
    Type: String
    Description: >
      AWS Account ID of your intermediate/trusted account where the Quiverstone Trusted
      Intermediate Role is deployed.
    AllowedPattern: "[0-9]{12}"
    MinLength: 1
    ConstraintDescription: Intermediate Account ID must be a valid 12-digit AWS account ID.

  pTrustPrincipals:
    Type: String
    Description: >
      Trust scope for the intermediate account:
      'All' - trust any principal in the intermediate account.
      'Named' - trust only the specific intermediate role below (recommended for least-privilege).
    Default: All
    AllowedValues:
      - All
      - Named

  pIntermediateRoleName:
    Type: String
    Default: QuiverstoneTrustedIntermediate
    Description: >
      Name of the Quiverstone Trusted Intermediate Role in the intermediate account.
      Required when Trust Scope is 'Named'. Populate even when using 'All' for documentation purposes.

Conditions:
  cHasExternalId: !Not [!Equals [!Ref pExternalId, ""]]
  cTrustEntireAccount: !Equals [!Ref pTrustPrincipals, All]
  cIntermediateRoleProvided: !Not [!Equals [!Ref pIntermediateRoleName, ""]]
  cNoIntermediateRoleProvided: !Equals [!Ref pIntermediateRoleName, ""]
Resources:
  rQuiverstoneChainedOrgInventoryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref pInventoryRoleName
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - !If
            - cTrustEntireAccount
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${pIntermediateAccountId}:root"
              Action: sts:AssumeRole
              Condition: !If
                - cHasExternalId
                - StringEquals:
                    sts:ExternalId: !Ref pExternalId
                - !Ref AWS::NoValue
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${pIntermediateAccountId}:role/${pIntermediateRoleName}"
              Action: sts:AssumeRole
              Condition: !If
                - cHasExternalId
                - StringEquals:
                    sts:ExternalId: !Ref pExternalId
                - !Ref AWS::NoValue
      Policies:
        - PolicyName: QuiverstoneChainedOrgInventoryPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Organizations read permissions - minimum access
              - Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:DescribeOrganizationalUnit
                  - organizations:DescribeAccount
                  - organizations:DescribePolicy
                  - organizations:DescribeResourcePolicy
                  - organizations:DescribeHandshake
                  - organizations:DescribeCreateAccountStatus
                  - organizations:DescribeEffectivePolicy
                  - organizations:ListRoots
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListAccountsForParent
                  - organizations:ListAccounts
                  - organizations:ListChildren
                  - organizations:ListParents
                  - organizations:ListPolicies
                  - organizations:ListPoliciesForTarget
                  - organizations:ListTargetsForPolicy
                  - organizations:ListHandshakesForOrganization
                  - organizations:ListHandshakesForAccount
                  - organizations:ListCreateAccountStatus
                  - organizations:ListAWSServiceAccessForOrganization
                  - organizations:ListDelegatedAdministrators
                  - organizations:ListDelegatedServicesForAccount
                  - organizations:ListTagsForResource
                Resource: "*"
              # Account information
              - Effect: Allow
                Action:
                  - account:GetAccountInformation
                  - account:GetAlternateContact
                  - account:GetContactInformation
                  - account:ListRegions
                Resource: "*"

Outputs:
  oTargetRoleArn:
    Description: >
      ARN of the inventory role. Use for 'Target Role ARN' in your Quiverstone
      organization configuration.
    Value: !GetAtt rQuiverstoneChainedOrgInventoryRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleArn"

  oExternalId:
    Condition: cHasExternalId
    Description: >
      External ID configured for this role. Must match the External ID in your
      Quiverstone organization settings.
    Value: !Ref pExternalId
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleExternalId"

  oIntermediateRoleArn:
    Condition: cIntermediateRoleProvided
    Description: >
      Constructed ARN of the intermediate role. Use for 'Intermediate Role ARN'
      in your Quiverstone organization configuration.
    Value: !Sub "arn:aws:iam::${pIntermediateAccountId}:role/${pIntermediateRoleName}"
    Export:
      Name: !Sub "${AWS::StackName}-IntermediateRoleArn"

  IntermediateRoleArnExcluded:
    Condition: cNoIntermediateRoleProvided
    Description: >
      NULL Value Provided
    Value: !Sub "IntermediateRoleName not provided, must get Role ARN from Intermediate account ${pIntermediateAccountId}."


  oTrustScope:
    Condition: cTrustEntireAccount
    Description: Trust scope configured for the intermediate account.
    Value: !Ref pTrustPrincipals
    Export:
      Name: !Sub "${AWS::StackName}-TrustScope"
