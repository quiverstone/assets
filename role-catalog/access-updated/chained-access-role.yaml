AWSTemplateFormatVersion: 2010-09-09
Description: >
  Quiverstone Chained Access Role - Deploys in target accounts to allow access through role chaining
  from an intermediate account with required External ID for confused deputy protection.

Metadata:
  TemplateInfo:
    Name: quiverstone-chained-access-role
    Deploy-To: Individual Account Home Region (e.g. us-east-1)
    Version: 2.0.0
    Source: github.com/quiverstone/assets/role-catalog/access/chained-access-role.yaml
    Note: >
      Deploys destination role in target account that can be assumed via role chaining from
      the intermediate account. Requires an External ID for confused deputy protection.
      The intermediate account must have the Quiverstone Trusted Intermediate Role deployed.
    QuickStackLink: https://console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/quickcreate?templateURL=https://s3.us-east-2.amazonaws.com/assets.quiverstone.io/role-catalog/access/chained-access-role.yaml&stackName=quiverstone-chained-access-role
    LastUpdated: 20260412
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Account Access Role Configuration
        Parameters:
          - pChainedAccessRoleName
          - pExternalId
      - Label:
          default: Intermediate Account Configuration
        Parameters:
          - pIntermediateAccountId
          - pTrustPrincipals
          - pIntermediateRoleName
      - Label:
          default: Permissions
        Parameters:
          - pIsReadOnlyAccess
          - pIsAdministratorAccess
          - pIsPowerUserAccess
          - pIsViewOnlyAccess
          - pIsSecurityAudit
          - pIsSystemAdministrator
          - pIsSupportUser
          - pIsBillingAccess
    ParameterLabels:
      pChainedAccessRoleName:
        default: Account Access Role Name
      pExternalId:
        default: External ID (Required)
      pIntermediateAccountId:
        default: Your Intermediate Account ID
      pTrustPrincipals:
        default: Trust Scope for Intermediate Account
      pIntermediateRoleName:
        default: Intermediate Role Name (Required if Trust Scope = 'Named')
      pIsReadOnlyAccess:
        default: Read Only Access
      pIsAdministratorAccess:
        default: Administrator Access
      pIsPowerUserAccess:
        default: Power User Access
      pIsViewOnlyAccess:
        default: View Only Access
      pIsSecurityAudit:
        default: Security Audit
      pIsSystemAdministrator:
        default: System Administrator
      pIsSupportUser:
        default: Support User
      pIsBillingAccess:
        default: Billing Access

Parameters:
  pChainedAccessRoleName:
    Type: String
    Default: QuiverstoneChainedAccess
    Description: Name for the destination account access role.
    MinLength: 1
    ConstraintDescription: Account Access Role Name must not be null.

  pExternalId:
    Type: String
    Description: >
      Unique External ID for this role's trust relationship. Required to prevent confused
      deputy attacks during role chaining. This value must match the External ID configured
      in your Quiverstone organization settings for this destination role.
    MinLength: 1
    MaxLength: 1224
    ConstraintDescription: External ID is required. Retrieve this value from your Quiverstone organization settings.

  pIntermediateAccountId:
    Type: String
    Description: >
      AWS Account ID of your intermediate/trusted account where the Quiverstone Trusted
      Intermediate Role is deployed. This is the account that will chain into this destination role.
    AllowedPattern: "[0-9]{12}"
    MinLength: 1
    ConstraintDescription: Intermediate Account ID must be a valid 12-digit AWS account ID.

  pTrustPrincipals:
    Type: String
    Description: >
      Trust scope for the intermediate account:
      'All' - trust any principal in the intermediate account (simpler but less restrictive).
      'Named' - trust only the specific intermediate role below (recommended for least-privilege).
    Default: All
    AllowedValues:
      - All
      - Named

  pIntermediateRoleName:
    Type: String
    Default: QuiverstoneTrustedIntermediate
    Description: >
      Name of the Quiverstone Trusted Intermediate Role in the intermediate account.
      Required when Trust Scope is 'Named'. Populate even when using 'All' for documentation purposes.

  pIsReadOnlyAccess:
    Type: String
    Description: Grants permissions to view resources and basic metadata across all AWS services.
    Default: yes
    AllowedValues:
      - no
      - yes

  pIsAdministratorAccess:
    Type: String
    Description: Provides full access to AWS services and resources.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsPowerUserAccess:
    Type: String
    Description: Provides full access to AWS services and resources, but does not allow management of users and groups.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsViewOnlyAccess:
    Type: String
    Description: Grants permissions to view resources and basic metadata across all AWS services.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsSecurityAudit:
    Type: String
    Description: Grants permissions to view configuration data for many AWS services and to review their logs.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsSystemAdministrator:
    Type: String
    Description: Grants full access permissions necessary for resources required for application operations.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsSupportUser:
    Type: String
    Description: Grants permissions to troubleshoot and resolve issues in an AWS account. This policy also enables the user to contact AWS support to create and manage cases.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsBillingAccess:
    Type: String
    Description: Grants permissions for billing and cost management. This includes viewing account usage and viewing and downloading AWS bills.
    Default: no
    AllowedValues:
      - no
      - yes

Conditions:
  cTrustEntireAccount: !Equals [!Ref pTrustPrincipals, All]
  cIsReadOnlyAccess: !Equals [yes, !Ref pIsReadOnlyAccess]
  cIsAdministratorAccess: !Equals [yes, !Ref pIsAdministratorAccess]
  cIsPowerUserAccess: !Equals [yes, !Ref pIsPowerUserAccess]
  cIsViewOnlyAccess: !Equals [yes, !Ref pIsViewOnlyAccess]
  cIsSecurityAudit: !Equals [yes, !Ref pIsSecurityAudit]
  cIsSystemAdministrator: !Equals [yes, !Ref pIsSystemAdministrator]
  cIsSupportUser: !Equals [yes, !Ref pIsSupportUser]
  cIsBillingAccess: !Equals [yes, !Ref pIsBillingAccess]

Resources:
  rQuiverstoneChainedAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref pChainedAccessRoleName
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - !If
            - cTrustEntireAccount
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${pIntermediateAccountId}:root"
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  sts:ExternalId: !Ref pExternalId
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${pIntermediateAccountId}:role/${pIntermediateRoleName}"
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  sts:ExternalId: !Ref pExternalId
      ManagedPolicyArns:
        - !If [
            cIsAdministratorAccess,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsReadOnlyAccess,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsPowerUserAccess,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsViewOnlyAccess,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsSecurityAudit,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/SecurityAudit",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsSystemAdministrator,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/job-function/SystemAdministrator",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsSupportUser,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/job-function/SupportUser",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsBillingAccess,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/job-function/Billing",
            !Ref AWS::NoValue,
          ]

Outputs:
  oTargetRoleArn:
    Description: >
      ARN of the destination account access role. Use for 'Target Role ARN' in your
      Quiverstone organization configuration.
    Value: !GetAtt rQuiverstoneChainedAccessRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleArn"

  oTargetRoleName:
    Description: >
      Name of the destination account access role. Use for 'Target Role Name' in your
      Quiverstone organization configuration.
    Value: !Ref rQuiverstoneChainedAccessRole
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleName"

  oExternalId:
    Description: >
      External ID configured for this destination role. Must match the External ID
      in your Quiverstone organization settings.
    Value: !Ref pExternalId
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleExternalId"

  oIntermediateRoleArn:
    Description: >
      Constructed ARN of the intermediate role. Use for 'Intermediate Role ARN' in your
      Quiverstone organization configuration.
    Value: !Sub "arn:aws:iam::${pIntermediateAccountId}:role/${pIntermediateRoleName}"
    Export:
      Name: !Sub "${AWS::StackName}-IntermediateRoleArn"

  oTrustScope:
    Description: >
      Trust scope configured for this role. 'All' trusts the entire intermediate account,
      'Named' trusts only the specific intermediate role.
    Value: !Ref pTrustPrincipals
    Export:
      Name: !Sub "${AWS::StackName}-TrustScope"
