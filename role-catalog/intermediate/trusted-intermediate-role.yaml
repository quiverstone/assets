AWSTemplateFormatVersion: 2010-09-09
Description: >
  Quiverstone Trusted Intermediate Role - Deploys a Role in an Intermediate "Trusted" Account to enable role chaining.

Metadata:
  TemplateInfo:
    Name: quiverstone-trusted-intermediate-role
    Deploy-To: Intermediate/Trusted Account Home Region (e.g. us-east-1)
    Version: 2.0.0
    Source: github.com/quiverstone/assets/role-catalog/intermediate/trusted-intermediate-role.yaml
    Note: >
      Deploys intermediate role in your trusted account that chains to destination roles in desired destination
      accounts. This role "trusts" the Quiverstone Prodution account and is "trusted" by a role in the end account.
      An External ID is REQUIRED for confused deputy protection.
    QuickStackLink: https://console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/quickcreate?templateURL=https://s3.us-east-2.amazonaws.com/assets.quiverstone.io/role-catalog/intermediate/trusted-intermediate-role.yaml&stackName=quiverstone-trusted-intermediate-role
    LastUpdated: 20260412
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Intermediate Role Configuration
        Parameters:
          - pIntermediateRoleName
          - pExternalId
          - pQuiverstoneProductionAccountId
      - Label:
          default: Destination Role Configuration
        Parameters:
          - pAssumeRoleScope
          - pDestinationAccountId
          - pDestinationRoleName
    ParameterLabels:
      pIntermediateRoleName:
        default: Intermediate Role Name
      pExternalId:
        default: External ID (Required)
      pQuiverstoneProductionAccountId:
        default: Quiverstone Production Account ID (DO NOT MODIFY)
      pAssumeRoleScope:
        default: Assume Role Scope
      pDestinationAccountId:
        default: Destination Account ID (Management or Delegated Account)
      pDestinationRoleName:
        default: Destination Role Name

Parameters:
  pIntermediateRoleName:
    Type: String
    Default: QuiverstoneIntermediate
    Description: Name for the intermediate role that will chain to destination roles.
    MinLength: 1
    ConstraintDescription: Intermediate Role Name must not be null but can be customized.

  pExternalId:
    Type: String
    Description: >
      Unique External ID provided by Quiverstone during organization onboarding. Required
      to prevent confused deputy attacks. This value is unique per customer and must match
      the External ID configured in your Quiverstone organization settings.
    MinLength: 1
    MaxLength: 1224
    ConstraintDescription: External ID is required. Retrieve this value from your Quiverstone Add Organization settings.

  pQuiverstoneProductionAccountId:
    Type: String
    Default: "684035162433"
    Description: >
      Quiverstone production account ID where the dedicated IAM user resides. DO NOT MODIFY.
    AllowedPattern: "[0-9]{12}"
    MinLength: 1
    ConstraintDescription: Must be a valid 12-digit AWS account ID.

  pAssumeRoleScope:
    Type: String
    Description: >
      Scope of destination roles this intermediate role can assume:
      'any-role-any-account' (least restrictive) - trusted access to any role in any account.
      'specific-account-and-role' (most restrictive) - single account with specific named role.
      'specific-role-any-account' (recommended) - assume the same role name across multiple accounts.
    Default: any-role-any-account
    AllowedValues:
      - any-role-any-account
      - specific-account-and-role
      - specific-role-any-account

  pDestinationAccountId:
    Type: String
    Default: ""
    Description: >
      Destination account ID where the target role exists. Required only for
      'specific-account-and-role' scope, ignored otherwise.
    AllowedPattern: "^$|[0-9]{12}"

  pDestinationRoleName:
    Type: String
    Default: ""
    Description: >
      Name of the destination role. Required for 'specific-account-and-role' and
      'specific-role-any-account' scopes, ignored for 'any-role-any-account'.

Conditions:
  cSpecificAccountAndRole:
    !Equals [!Ref pAssumeRoleScope, specific-account-and-role]
  cSpecificRoleAnyAccount:
    !Equals [!Ref pAssumeRoleScope, specific-role-any-account]
  cAnyRole: !Equals [!Ref pAssumeRoleScope, any-role-any-account]

Resources:
  rQuiverstoneIntermediateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref pIntermediateRoleName
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              #AWS: !Sub "arn:aws:iam::${pQuiverstoneProductionAccountId}:user/${pQuiverstoneIAMUserName}"
              AWS: !Sub "arn:aws:iam::${pQuiverstoneProductionAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref pExternalId
      Policies:
        - PolicyName: QuiverstoneIntermediateRoleAssume
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Specific account and role
              - !If
                - cSpecificAccountAndRole
                - Effect: Allow
                  Action:
                    - sts:AssumeRole
                  Resource:
                    - !Sub "arn:aws:iam::${pDestinationAccountId}:role/${pDestinationRoleName}"
                - !Ref AWS::NoValue
              # Specific role name in any account
              - !If
                - cSpecificRoleAnyAccount
                - Effect: Allow
                  Action:
                    - sts:AssumeRole
                  Resource:
                    - !Sub "arn:aws:iam::*:role/${pDestinationRoleName}"
                - !Ref AWS::NoValue
              # Any role in any account
              - !If
                - cAnyRole
                - Effect: Allow
                  Action:
                    - sts:AssumeRole
                  Resource:
                    - arn:aws:iam::*:role/*
                - !Ref AWS::NoValue

Outputs:
  oIntermediateRoleArn:
    Description: >
      ARN of the Intermediate Role. Use for 'Intermediate Role ARN' in your
      Quiverstone organization configuration.
    Value: !GetAtt rQuiverstoneIntermediateRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-IntermediateRoleArn"

  oExternalId:
    Description: >
      External ID configured for the intermediate role. This must match the
      External ID in your Quiverstone organization settings.
    Value: !Ref pExternalId
    Export:
      Name: !Sub "${AWS::StackName}-IntermediateRoleExternalId"

  oTrustedPrincipal:
    Description: >
      The IAM user principal trusted by this intermediate role. Only this specific
      IAM user in the Quiverstone production account can assume this role.
    # Value: !Sub "arn:aws:iam::${pQuiverstoneProductionAccountId}:user/${pQuiverstoneIAMUserName}"
    Value: !Sub "arn:aws:iam::${pQuiverstoneProductionAccountId}:root"
    Export:
      Name: !Sub "${AWS::StackName}-TrustedPrincipal"
