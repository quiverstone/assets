AWSTemplateFormatVersion: 2010-09-09
Description: Quiverstone Chained Account Access Destination Role - Deploys in target accounts to allow read-only access through role chaining

Metadata:
  TemplateInfo:
    Name: quiverstone-chained-account-access-destination
    Deploy-To: Individual Account Home Region (e.g. us-east-1)
    Version: 1.0.0
    Source: github.com/quiverstone/assets/role-catalog/access/quiverstone-chained-account-access-destination.yaml
    Note: Deploys destination role in target account that can be assumed via role chaining from intermediate account
    QuickStackLink: https://console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/quickcreate?templateURL=https://assets.quiverston.io.s3.us-east-2.amazonaws.com/quiverstone-roles-catalog/access/quiverstone-chained-account-access-destination.yaml&stackName=quiverstone-chained-account-access-destination
    LastUpdated: 20251112
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Account Access Role Configuration
        Parameters:
          - pAccountAccessRoleName
          - pExternalId
      - Label:
          default: Intermediate Account Configuration
        Parameters:
          - pIntermediateAccountId
          - pTrustPrincipals
          - pIntermediateRoleName
          - pIntermediateRoleExternalId
    ParameterLabels:
      pAccountAccessRoleName:
        default: Account Access Role Name
      pExternalId:
        default: External ID (Optional)
      pIntermediateAccountId:
        default: Intermediate Account ID
      pTrustPrincipals:
        default: Trust All Principals in Intermediate Account
      pIntermediateRoleName:
        default: Intermediate Role Name (Required if Trust Principals = 'Named')
      pIntermediateRoleExternalId:
        default: Intermediate Role External ID (Reference Only)

Parameters:
  pAccountAccessRoleName:
    Type: String
    Default: QuiverstoneChainedAccountAccess
    Description: Name for the destination account access role
    MinLength: 1
    ConstraintDescription: Account Access Role Name must not be null

  pExternalId:
    Type: String
    Default: ""
    Description: External ID for role assumption (recommended for security)
    MaxLength: 1224

  pIntermediateAccountId:
    Type: String
    Description: AWS Account ID that serves as the intermediate hop for role chaining
    AllowedPattern: "[0-9]{12}"
    MinLength: 1
    ConstraintDescription: Intermediate Account Id must not be null

  pTrustPrincipals:
    Type: String
    Description: >
      Trust all principals in the intermediate account instead of a specific role. |
      Set to 'All' to allow any role in trusted account. |
      Set to 'Named' to trust only the named role provided below (the role must exist first).
    Default: Named
    AllowedValues:
      - All
      - Named

  pIntermediateRoleName:
    Type: String
    Default: QuiverstoneChainHopRole
    Description: >
      Name of the role in the intermediate account that can assume this role (populate for reference even if trusting entire account).

  pIntermediateRoleExternalId:
    Type: String
    Default: ""
    Description: External ID for Intermediate role assumption (reference only for Quiverstone Configuration)
    MaxLength: 1224

Conditions:
  cHasExternalId: !Not [!Equals [!Ref pExternalId, ""]]
  cTrustEntireAccount: !Equals [!Ref pTrustPrincipals, All]
  cHasIntermediateRoleExternalId:
    !Not [!Equals [!Ref pIntermediateRoleExternalId, ""]]
  cIntermediateRoleProvided: !Not [!Equals [!Ref pIntermediateRoleName, ""]]
  cNoIntermediateRoleProvided: !Equals [!Ref pIntermediateRoleName, ""]

Resources:
  rQuiverstoneChainedAccountAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref pAccountAccessRoleName
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - !If
            - cTrustEntireAccount
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${pIntermediateAccountId}:root"
              Action: sts:AssumeRole
              Condition: !If
                - cHasExternalId
                - StringEquals:
                    sts:ExternalId: !Ref pExternalId
                - !Ref AWS::NoValue
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${pIntermediateAccountId}:role/${pIntermediateRoleName}"
              Action: sts:AssumeRole
              Condition: !If
                - cHasExternalId
                - StringEquals:
                    sts:ExternalId: !Ref pExternalId
                - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
      Policies:
        - PolicyName: QuiverstoneChainedAccountAccessPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Account information
              - Effect: Allow
                Action:
                  - account:GetAccountInformation
                  - account:GetAlternateContact
                  - account:GetContactInformation
                  - account:ListRegions
                Resource: "*"
              # Basic support access
              - Effect: Allow
                Action:
                  - support:DescribeServices
                  - support:DescribeSeverityLevels
                  - support:DescribeCommunications
                  - support:DescribeCases
                Resource: "*"

Outputs:
  oTargetRoleArn:
    Description: ARN of the destination account access role
    Value: !GetAtt rQuiverstoneChainedAccountAccessRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleArn"

  oTargetRoleExternalId:
    Condition: cHasExternalId
    Description: External ID for target role assumption
    Value: !Ref pExternalId
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleExternalId"

  oIntermediateRoleArn:
    Condition: cIntermediateRoleProvided
    Description: ARN of the intermediate role for Quiverstone configuration
    Value: !Sub "arn:aws:iam::${pIntermediateAccountId}:role/${pIntermediateRoleName}"
    Export:
      Name: !Sub "${AWS::StackName}-IntermediateRoleArn"

  oIntermediateRoleArnExcluded:
    Condition: cNoIntermediateRoleProvided
    Description: Notice about missing intermediate role name
    Value: !Sub "IntermediateRoleName not provided, must get Role ARN from Intermediate account ${pIntermediateAccountId}."

  oIntermediateRoleExternalId:
    Condition: cHasIntermediateRoleExternalId
    Description: External ID for intermediate role assumption
    Value: !Ref pIntermediateRoleExternalId
    Export:
      Name: !Sub "${AWS::StackName}-IntermediateRoleExternalId"

  oTrustAllPrincipals:
    Condition: cTrustEntireAccount
    Description: Trust configuration notice
    Value: !Sub "You have selected to trust all principals in the intermediate account ${pIntermediateAccountId}. Ensure this is what you want."
