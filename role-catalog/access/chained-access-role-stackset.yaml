AWSTemplateFormatVersion: "2010-09-09"
Description: Quiverstone Chained Access Role StackSet - Deploys chained access role across all organization accounts

Metadata:
  TemplateInfo:
    Name: stackset-quiverstone-chained-access-rpole
    Deploy-To: Management Account Home Region (e.g. us-east-1)
    Version: 1.0.0
    Source: github.com/quiverstone/assets/role-catalog/access/chained-access-role-stackset.yaml
    Note: Creates a StackSet that deploys chained account access role to all organization accounts
    QuickStackLink: https://console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/quickcreate?templateURL=https://s3.us-east-2.amazonaws.com/assets.quiverstone.io/role-catalog/access/chained-access-role-stackset.yaml&stackName=stackset-quiverstone-chained-access-role
    LastUpdated: 20251112
  cfn_nag:
    rules_to_suppress:
      - id: W28
        reason: Explicit name is required for stack set functionality.
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: StackSet Configuration
        Parameters:
          - pDeploymentOUs
          - pDeploymentRegion
      - Label:
          default: Account Access Role Configuration
        Parameters:
          - pChainedAccessRoleName
          - pExternalId
      - Label:
          default: Intermediate Account Configuration
        Parameters:
          - pIntermediateAccountId
          - pTrustPrincipals
          - pIntermediateRoleName
          - pIntermediateRoleExternalId
      - Label:
          default: Permissions
        Parameters:
          - pIsReadOnlyAccess
          - pIsAdministratorAccess
          - pIsPowerUserAccess
          - pIsViewOnlyAccess
          - pIsSecurityAudit
          - pIsSystemAdministrator
          - pIsSupportUser
          - pIsBillingAccess
    ParameterLabels:
      pDeploymentOUs:
        default: Deployment Organizational Units
      pDeploymentRegion:
        default: Deployment Region
      pChainedAccessRoleName:
        default: Account Access Role Name
      pExternalId:
        default: External ID (Optional)
      pIntermediateAccountId:
        default: Intermediate Account ID
      pTrustPrincipals:
        default: Trust All Principals in Intermediate Account
      pIntermediateRoleName:
        default: Intermediate Role Name (Required if Trust Principals = 'Named')
      pIntermediateRoleExternalId:
        default: Intermediate Role External ID (Reference Only)
      pIsReadOnlyAccess:
        default: Read Only Access
      pIsAdministratorAccess:
        default: Administrator Access
      pIsPowerUserAccess:
        default: Power User Access
      pIsViewOnlyAccess:
        default: View Only Access
      pIsSecurityAudit:
        default: Security Audit
      pIsSystemAdministrator:
        default: System Administrator
      pIsSupportUser:
        default: Support User
      pIsBillingAccess:
        default: Billing Access

Parameters:
  pDeploymentOUs:
    Type: CommaDelimitedList
    Description: Organization Unit IDs to deploy to (comma-separated). Use root OU ID to deploy to all accounts.

  pDeploymentRegion:
    Type: String
    Description: AWS Region to deploy the roles
    Default: us-east-1
    AllowedValues:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-central-1
      - ap-southeast-1
      - ap-southeast-2
      - ap-northeast-1

  pChainedAccessRoleName:
    Type: String
    Default: QuiverstoneChainedAccess
    Description: Name for the destination account access role
    MinLength: 1

  pExternalId:
    Type: String
    Default: ""
    Description: External ID for role assumption (recommended for security)
    MaxLength: 1224

  pIntermediateAccountId:
    Type: String
    Description: AWS Account ID that serves as the intermediate hop for role chaining
    AllowedPattern: "[0-9]{12}"
    MinLength: 1

  pTrustPrincipals:
    Type: String
    Description: Trust all principals in the intermediate account (All) or only a named role (Named)
    Default: All
    AllowedValues:
      - All
      - Named

  pIntermediateRoleName:
    Type: String
    Default: QuiverstoneTrustedIntermediate
    Description: Name of the role in the intermediate account that can assume this role

  pIntermediateRoleExternalId:
    Type: String
    Default: ""
    Description: External ID for Intermediate role assumption (reference only for Quiverstone Configuration)
    MaxLength: 1224

  pIsReadOnlyAccess:
    Type: String
    Description: Grants permissions to view resources and basic metadata across all AWS services.
    Default: yes
    AllowedValues:
      - no
      - yes

  pIsAdministratorAccess:
    Type: String
    Description: Provides full access to AWS services and resources.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsPowerUserAccess:
    Type: String
    Description: Provides full access to AWS services and resources, but does not allow management of users and groups.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsViewOnlyAccess:
    Type: String
    Description: Grants permissions to view resources and basic metadata across all AWS services.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsSecurityAudit:
    Type: String
    Description: Grants permissions to view configuration data for many AWS services and to review their logs.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsSystemAdministrator:
    Type: String
    Description: Grants full access permissions necessary for resources required for application operations.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsSupportUser:
    Type: String
    Description: Grants permissions to troubleshoot and resolve issues in an AWS account. This policy also enables the user to contact AWS support to create and manage cases.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsBillingAccess:
    Type: String
    Description: Grants permissions for billing and cost management. This includes viewing account usage and viewing and downloading AWS bills.
    Default: no
    AllowedValues:
      - no
      - yes

Resources:
  rChainedAccountAccessStackSet:
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: quiverstone-chained-account-access-destination
      Description: Quiverstone Chained Account Access Destination - Provides read-only access to all organization accounts via role chaining
      PermissionModel: SERVICE_MANAGED
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_IAM
        - CAPABILITY_NAMED_IAM
      OperationPreferences:
        MaxConcurrentPercentage: 100
        FailureTolerancePercentage: 100
        RegionConcurrencyType: PARALLEL
      StackInstancesGroup:
        - Regions:
            - !Ref pDeploymentRegion
          DeploymentTargets:
            OrganizationalUnitIds: !Ref pDeploymentOUs
      Parameters:
        - ParameterKey: pChainedAccessRoleName
          ParameterValue: !Ref pChainedAccessRoleName
        - ParameterKey: pExternalId
          ParameterValue: !Ref pExternalId
        - ParameterKey: pIntermediateAccountId
          ParameterValue: !Ref pIntermediateAccountId
        - ParameterKey: pTrustPrincipals
          ParameterValue: !Ref pTrustPrincipals
        - ParameterKey: pIntermediateRoleName
          ParameterValue: !Ref pIntermediateRoleName
        - ParameterKey: pIntermediateRoleExternalId
          ParameterValue: !Ref pIntermediateRoleExternalId
        - ParameterKey: pIsReadOnlyAccess
          ParameterValue: !Ref pIsReadOnlyAccess
        - ParameterKey: pIsAdministratorAccess
          ParameterValue: !Ref pIsAdministratorAccess
        - ParameterKey: pIsPowerUserAccess
          ParameterValue: !Ref pIsPowerUserAccess
        - ParameterKey: pIsViewOnlyAccess
          ParameterValue: !Ref pIsViewOnlyAccess
        - ParameterKey: pIsSecurityAudit
          ParameterValue: !Ref pIsSecurityAudit
        - ParameterKey: pIsSystemAdministrator
          ParameterValue: !Ref pIsSystemAdministrator
        - ParameterKey: pIsSupportUser
          ParameterValue: !Ref pIsSupportUser
        - ParameterKey: pIsBillingAccess
          ParameterValue: !Ref pIsBillingAccess
      TemplateURL: https://s3.us-east-2.amazonaws.com/assets.quiverstone.io/role-catalog/access/quiverstone-chained-account-access-destination.yaml
      Tags:
        - Key: Name
          Value: quiverstone-chained-account-access-destination
        - Key: Purpose
          Value: read-only-chained-account-access
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  oStackSetName:
    Description: Name of the StackSet
    Value: quiverstone-chained-account-access-destination

  oDeploymentOUs:
    Description: Organizational Units where roles are deployed
    Value: !Join [", ", !Ref pDeploymentOUs]

  oDeploymentRegion:
    Description: Region where roles are deployed
    Value: !Ref pDeploymentRegion
