AWSTemplateFormatVersion: 2010-09-09
Description: Quiverstone Chained Account Access Intermediate Role - Deploys in the Intermediate Account to enable role chaining for account access

Metadata:
  TemplateInfo:
    Name: quiverstone-chained-account-access-intermediate
    Deploy-To: Intermediate/Trusted Account Home Region (e.g. us-east-1)
    Version: 1.0.0
    Source: github.com/quiverstone/assets/role-catalog/access/quiverstone-chained-account-access-intermediate.yaml
    Note: Deploys intermediate role in trusted account that can chain to destination roles in child accounts
    QuickStackLink: https://console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/quickcreate?templateURL=https://assets.quiverston.io.s3.us-east-2.amazonaws.com/quiverstone-roles-catalog/access/quiverstone-chained-account-access-intermediate.yaml&stackName=quiverstone-chained-account-access-intermediate
    LastUpdated: 20251112
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Intermediate Role Configuration
        Parameters:
          - pIntermediateRoleName
          - pExternalId
      - Label:
          default: Trusted Principal Configuration
        Parameters:
          - pQuiverstoneProductionAccountId
      - Label:
          default: Destination Role Configuration
        Parameters:
          - pAssumeRoleScope
          - pDestinationAccountId
          - pDestinationRoleName
    ParameterLabels:
      pIntermediateRoleName:
        default: Intermediate Role Name
      pExternalId:
        default: External ID (Optional)
      pQuiverstoneProductionAccountId:
        default: Quiverstone Production Account (684035162433)
      pAssumeRoleScope:
        default: Assume Role Scope
      pDestinationAccountId:
        default: Destination Account ID (Child Account)
      pDestinationRoleName:
        default: Destination Role Name

Parameters:
  pIntermediateRoleName:
    Type: String
    Default: QuiverstoneChainHopRole
    Description: Name for the intermediate role that will chain to the destination accounts
    MinLength: 1
    ConstraintDescription: Intermediate Role Name must not be null

  pExternalId:
    Type: String
    Default: ""
    Description: External ID for this intermediate role assumption (recommended for security)
    MaxLength: 1224

  pQuiverstoneProductionAccountId:
    Type: String
    Default: 684035162433
    Description: Quiverstone production account ID that can assume this intermediate role (DO NOT MODIFY)
    AllowedPattern: "[0-9]{12}"
    MinLength: 1
    ConstraintDescription: Quiverstone Production Account ID must not be null

  pAssumeRoleScope:
    Type: String
    Description: >
      Scope of destination roles this intermediate role can assume:
      Least Restrictive - 'any-role-any-account' for trusted access to any role in any account. |
      Most Restrictive - 'specific-account-and-role' for single account destination with specific named role. |
      Best Option - 'specific-role-any-account' to assume the same role name across multiple accounts.
    Default: any-role-any-account
    AllowedValues:
      - any-role-any-account
      - specific-account-and-role
      - specific-role-any-account

  pDestinationAccountId:
    Type: String
    Default: ""
    Description: Child Account ID where the destination role exists (required only for 'specific-account-and-role' scope, ignored otherwise)
    AllowedPattern: "^$|[0-9]{12}"

  pDestinationRoleName:
    Type: String
    Default: ""
    Description: Name of the destination role (required for 'specific-account-and-role' and 'specific-role-any-account' scopes, ignored for 'any-role-any-account')

Conditions:
  cHasExternalId: !Not [!Equals [!Ref pExternalId, ""]]
  cSpecificAccountAndRole:
    !Equals [!Ref pAssumeRoleScope, specific-account-and-role]
  cSpecificRoleAnyAccount:
    !Equals [!Ref pAssumeRoleScope, specific-role-any-account]
  cAnyRole: !Equals [!Ref pAssumeRoleScope, any-role-any-account]

Resources:
  rQuiverstoneChainHopRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref pIntermediateRoleName
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${pQuiverstoneProductionAccountId}:root"
            Action: sts:AssumeRole
            Condition: !If
              - cHasExternalId
              - StringEquals:
                  sts:ExternalId: !Ref pExternalId
              - !Ref AWS::NoValue
      Policies:
        - PolicyName: QuiverstoneChainHopPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Specific account and role
              - !If
                - cSpecificAccountAndRole
                - Effect: Allow
                  Action:
                    - sts:AssumeRole
                  Resource:
                    - !Sub "arn:aws:iam::${pDestinationAccountId}:role/${pDestinationRoleName}"
                - !Ref AWS::NoValue
              # Specific role name in any account
              - !If
                - cSpecificRoleAnyAccount
                - Effect: Allow
                  Action:
                    - sts:AssumeRole
                  Resource:
                    - !Sub "arn:aws:iam::*:role/${pDestinationRoleName}"
                - !Ref AWS::NoValue
              # Any role in any account
              - !If
                - cAnyRole
                - Effect: Allow
                  Action:
                    - sts:AssumeRole
                  Resource:
                    - arn:aws:iam::*:role/*
                - !Ref AWS::NoValue

Outputs:
  oIntermediateRoleArn:
    Description: ARN of the intermediate role for Quiverstone configuration
    Value: !GetAtt rQuiverstoneChainHopRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-IntermediateRoleArn"

  oIntermediateRoleExternalId:
    Condition: cHasExternalId
    Description: External ID for intermediate role assumption
    Value: !Ref pExternalId
    Export:
      Name: !Sub "${AWS::StackName}-IntermediateRoleExternalId"

  oIntermediateRoleName:
    Description: Name of the intermediate role
    Value: !Ref pIntermediateRoleName
    Export:
      Name: !Sub "${AWS::StackName}-IntermediateRoleName"
