AWSTemplateFormatVersion: "2010-09-09"
Description: Quiverstone Direct Account Access StackSet - Deploys read-only access roles across all organization accounts

Metadata:
  TemplateInfo:
    Name: stackset-quiverstone-direct-account-access
    Deploy-To: Management Account Home Region (e.g. us-east-1)
    Version: 1.0.0
    Source: github.com/quiverstone/assets/role-catalog/access/stackset-quiverstone-direct-account-access.yaml
    Note: Creates a StackSet that deploys direct account access roles to all organization accounts
    LastUpdated: 20251112
  cfn_nag:
    rules_to_suppress:
      - id: W28
        reason: Explicit name is required for stack set functionality.
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: StackSet Configuration
        Parameters:
          - pDeploymentOUs
          - pDeploymentRegion
          - pNonceValue
      - Label:
          default: Role Configuration
        Parameters:
          - pRoleName
          - pExternalId
      - Label:
          default: Trusted Account Configuration
        Parameters:
          - pQuiverstoneProductionAccountId
    ParameterLabels:
      pDeploymentOUs:
        default: Deployment Organizational Units
      pDeploymentRegion:
        default: Deployment Region
      pNonceValue:
        default: Nonce Value
      pRoleName:
        default: Target Role Name
      pExternalId:
        default: External ID (Optional)
      pQuiverstoneProductionAccountId:
        default: Quiverstone Production Account (684035162433)

Parameters:
  pDeploymentOUs:
    Type: CommaDelimitedList
    Description: Organization Unit IDs to deploy to (comma-separated). Use root OU ID to deploy to all accounts.

  pDeploymentRegion:
    Type: String
    Description: AWS Region to deploy the roles
    Default: us-east-1
    AllowedValues:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-central-1
      - ap-southeast-1
      - ap-southeast-2
      - ap-northeast-1

  pNonceValue:
    Type: String
    Description: Random identifier to force update of StackSet resource (change this value to update the StackSet)
    Default: "1"

  pRoleName:
    Type: String
    Default: QuiverstoneDirectAccountAccess
    Description: Name for the direct account access role
    MinLength: 1

  pQuiverstoneProductionAccountId:
    Type: String
    Default: 684035162433
    Description: Quiverstone production account ID that can assume this role (DO NOT MODIFY)
    AllowedPattern: "[0-9]{12}"
    MinLength: 1

  pExternalId:
    Type: String
    Default: ""
    Description: External ID for additional security (recommended)
    MaxLength: 1224

Conditions:
  cIsPrimaryRegion: !Equals [!Ref AWS::Region, us-east-1]

Resources:
  rDirectAccountAccessStackSet:
    Condition: cIsPrimaryRegion
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: quiverstone-direct-account-access
      Description: Quiverstone Direct Account Access - Provides read-only access to all organization accounts
      PermissionModel: SERVICE_MANAGED
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_IAM
        - CAPABILITY_NAMED_IAM
      OperationPreferences:
        MaxConcurrentPercentage: 100
        FailureTolerancePercentage: 100
        RegionConcurrencyType: PARALLEL
      StackInstancesGroup:
        - Regions:
            - !Ref pDeploymentRegion
          DeploymentTargets:
            OrganizationalUnitIds: !Ref pDeploymentOUs
      Parameters:
        - ParameterKey: pRoleName
          ParameterValue: !Ref pRoleName
        - ParameterKey: pQuiverstoneProductionAccountId
          ParameterValue: !Ref pQuiverstoneProductionAccountId
        - ParameterKey: pExternalId
          ParameterValue: !Ref pExternalId
      TemplateURL: https://s3.us-east-2.amazonaws.com/assets.quiverstone.io/role-catalog/access/quiverstone-direct-account-access.yaml
      Tags:
        - Key: Name
          Value: quiverstone-direct-account-access
        - Key: Purpose
          Value: read-only-account-access
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  oStackSetId:
    Condition: cIsPrimaryRegion
    Description: StackSet ID for the direct account access deployment
    Value: !GetAtt rDirectAccountAccessStackSet.StackSetId
    Export:
      Name: !Sub "${AWS::StackName}-StackSetId"

  oStackSetName:
    Description: Name of the StackSet
    Value: quiverstone-direct-account-access

  oDeploymentOUs:
    Description: Organizational Units where roles are deployed
    Value: !Join [", ", !Ref pDeploymentOUs]

  oDeploymentRegion:
    Description: Region where roles are deployed
    Value: !Ref pDeploymentRegion

  oNonceValue:
    Description: Current nonce value for tracking updates
    Value: !Ref pNonceValue
