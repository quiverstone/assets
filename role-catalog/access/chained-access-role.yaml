AWSTemplateFormatVersion: 2010-09-09
Description: Quiverstone Chained Access Role - Deploys in target accounts to allow access through role chaining

Metadata:
  TemplateInfo:
    Name: quiverstone-chained-access-role
    Deploy-To: Individual Account Home Region (e.g. us-east-1)
    Version: 1.0.0
    Source: github.com/quiverstone/assets/role-catalog/access/chained-account-access-destination.yaml
    Note: Deploys destination role in target account that can be assumed via role chaining from intermediate account
    QuickStackLink: https://console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/quickcreate?templateURL=https://s3.us-east-2.amazonaws.com/assets.quiverstone.io/role-catalog/access/chained-access-role.yaml&stackName=quiverstone-chained-access-role
    LastUpdated: 20251112
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Account Access Role Configuration
        Parameters:
          - pChainedAccessRoleName
          - pExternalId
      - Label:
          default: Intermediate Account Configuration
        Parameters:
          - pIntermediateAccountId
          - pTrustPrincipals
          - pIntermediateRoleName
          - pIntermediateRoleExternalId
      - Label:
          default: Permissions
        Parameters:
          - pIsReadOnlyAccess
          - pIsAdministratorAccess
          - pIsPowerUserAccess
          - pIsViewOnlyAccess
          - pIsSecurityAudit
          - pIsSystemAdministrator
          - pIsSupportUser
          - pIsBillingAccess
    ParameterLabels:
      pChainedAccessRoleName:
        default: Account Access Role Name
      pExternalId:
        default: External ID (Optional)
      pIntermediateAccountId:
        default: Intermediate Account ID
      pTrustPrincipals:
        default: Trust All Principals in Intermediate Account
      pIntermediateRoleName:
        default: Intermediate Role Name (Required if Trust Principals = 'Named')
      pIntermediateRoleExternalId:
        default: Intermediate Role External ID (Reference Only)
      pIsReadOnlyAccess:
        default: Read Only Access
      pIsAdministratorAccess:
        default: Administrator Access
      pIsPowerUserAccess:
        default: Power User Access
      pIsViewOnlyAccess:
        default: View Only Access
      pIsSecurityAudit:
        default: Security Audit
      pIsSystemAdministrator:
        default: System Administrator
      pIsSupportUser:
        default: Support User
      pIsBillingAccess:
        default: Billing Access

Parameters:
  pChainedAccessRoleName:
    Type: String
    Default: QuiverstoneChainedAccess
    Description: Name for the destination account access role
    MinLength: 1
    ConstraintDescription: Account Access Role Name must not be null

  pExternalId:
    Type: String
    Default: ""
    Description: External ID for role assumption (recommended for security)
    MaxLength: 1224

  pIntermediateAccountId:
    Type: String
    Description: AWS Account ID that serves as the intermediate hop for role chaining (You own have access to this account)
    AllowedPattern: "[0-9]{12}"
    MinLength: 1
    ConstraintDescription: Intermediate Account Id must not be null

  pTrustPrincipals:
    Type: String
    Description: >
      Trust all principals in the intermediate account instead of a specific role. |
      Set to 'All' to allow any role in trusted account. |
      Set to 'Named' to trust only the named role provided below (the role must exist first).
    Default: All
    AllowedValues:
      - All
      - Named

  pIntermediateRoleName:
    Type: String
    Default: QuiverstoneTrustedIntermediate
    Description: >
      Name of the role in the intermediate account that can assume this role (populate for reference even if trusting entire account).

  pIntermediateRoleExternalId:
    Type: String
    Default: ""
    Description: External ID for Intermediate role assumption (reference only for Quiverstone Configuration)
    MaxLength: 1224

  pIsReadOnlyAccess:
    Type: String
    Description: Grants permissions to view resources and basic metadata across all AWS services.
    Default: yes
    AllowedValues:
      - no
      - yes

  pIsAdministratorAccess:
    Type: String
    Description: Provides full access to AWS services and resources.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsPowerUserAccess:
    Type: String
    Description: Provides full access to AWS services and resources, but does not allow management of users and groups.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsViewOnlyAccess:
    Type: String
    Description: Grants permissions to view resources and basic metadata across all AWS services.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsSecurityAudit:
    Type: String
    Description: Grants permissions to view configuration data for many AWS services and to review their logs.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsSystemAdministrator:
    Type: String
    Description: Grants full access permissions necessary for resources required for application operations.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsSupportUser:
    Type: String
    Description: Grants permissions to troubleshoot and resolve issues in an AWS account. This policy also enables the user to contact AWS support to create and manage cases.
    Default: no
    AllowedValues:
      - no
      - yes

  pIsBillingAccess:
    Type: String
    Description: Grants permissions for billing and cost management. This includes viewing account usage and viewing and downloading AWS bills.
    Default: no
    AllowedValues:
      - no
      - yes

Conditions:
  cHasExternalId: !Not [!Equals [!Ref pExternalId, ""]]
  cTrustEntireAccount: !Equals [!Ref pTrustPrincipals, All]
  cHasIntermediateRoleExternalId:
    !Not [!Equals [!Ref pIntermediateRoleExternalId, ""]]
  cIntermediateRoleProvided: !Not [!Equals [!Ref pIntermediateRoleName, ""]]
  cNoIntermediateRoleProvided: !Equals [!Ref pIntermediateRoleName, ""]
  cIsReadOnlyAccess: !Equals [yes, !Ref pIsReadOnlyAccess]
  cIsAdministratorAccess: !Equals [yes, !Ref pIsAdministratorAccess]
  cIsPowerUserAccess: !Equals [yes, !Ref pIsPowerUserAccess]
  cIsViewOnlyAccess: !Equals [yes, !Ref pIsViewOnlyAccess]
  cIsSecurityAudit: !Equals [yes, !Ref pIsSecurityAudit]
  cIsSystemAdministrator: !Equals [yes, !Ref pIsSystemAdministrator]
  cIsSupportUser: !Equals [yes, !Ref pIsSupportUser]
  cIsBillingAccess: !Equals [yes, !Ref pIsBillingAccess]

Resources:
  rQuiverstoneChainedAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref pChainedAccessRoleName
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - !If
            - cTrustEntireAccount
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${pIntermediateAccountId}:root"
              Action: sts:AssumeRole
              Condition: !If
                - cHasExternalId
                - StringEquals:
                    sts:ExternalId: !Ref pExternalId
                - !Ref AWS::NoValue
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${pIntermediateAccountId}:role/${pIntermediateRoleName}"
              Action: sts:AssumeRole
              Condition: !If
                - cHasExternalId
                - StringEquals:
                    sts:ExternalId: !Ref pExternalId
                - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !If [
            cIsAdministratorAccess,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsReadOnlyAccess,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsPowerUserAccess,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsViewOnlyAccess,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsSecurityAudit,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/SecurityAudit",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsSystemAdministrator,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/job-function/SystemAdministrator",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsSupportUser,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/job-function/SupportUser",
            !Ref AWS::NoValue,
          ]
        - !If [
            cIsBillingAccess,
            !Sub "arn:${AWS::Partition}:iam::aws:policy/job-function/Billing",
            !Ref AWS::NoValue,
          ]

Outputs:
  oTargetRoleArn:
    Description: ARN of the destination account access role
    Value: !GetAtt rQuiverstoneChainedAccessRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleArn"

  oTargetRoleName:
    Description: Name of the destination account access role
    Value: !Ref rQuiverstoneChainedAccessRole
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleName"

  oTargetRoleExternalId:
    Condition: cHasExternalId
    Description: External ID for target role assumption
    Value: !Ref pExternalId
    Export:
      Name: !Sub "${AWS::StackName}-TargetRoleExternalId"

  oIntermediateRoleArn:
    Condition: cIntermediateRoleProvided
    Description: ARN of the intermediate role for Quiverstone configuration
    Value: !Sub "arn:aws:iam::${pIntermediateAccountId}:role/${pIntermediateRoleName}"
    Export:
      Name: !Sub "${AWS::StackName}-IntermediateRoleArn"

  oIntermediateRoleArnExcluded:
    Condition: cNoIntermediateRoleProvided
    Description: Notice about missing intermediate role name
    Value: !Sub "IntermediateRoleName not provided, must get Role ARN from Intermediate account ${pIntermediateAccountId}."

  oIntermediateRoleExternalId:
    Condition: cHasIntermediateRoleExternalId
    Description: External ID for intermediate role assumption
    Value: !Ref pIntermediateRoleExternalId
    Export:
      Name: !Sub "${AWS::StackName}-IntermediateRoleExternalId"

  oTrustAllPrincipals:
    Condition: cTrustEntireAccount
    Description: Trust configuration notice
    Value: !Sub "You have selected to trust all principals in the intermediate account ${pIntermediateAccountId}. Ensure this is what you want."
